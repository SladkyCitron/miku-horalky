<!doctype html>
<html lang="sk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Miku Horalky</title>
    </head>
    <body>
        <div class="header">
            <a href="#" aria-label="Domovská stránka">
                <img
                    src="assets/logo.svg"
                    alt="Hatsune Miku Logo"
                    class="logo"
                />
            </a>
            <a
                href="https://github.com/SladkyCitron"
                aria-label="SladkyCitron na GitHube"
            >
                <img
                    src="assets/github.svg"
                    alt="GitHub Logo"
                    class="github-logo"
                />
            </a>
        </div>
        <div class="hero-container">
            <img src="assets/hero.jpg" alt="Miku" class="hero-img" />
            <a href="https://piapro.net" class="cta-button">Objavte viac</a>
        </div>
        <div class="content">
            <h1 class="title">Najobľúbenejšia virtuálna speváčka na svete.</h1>
            <div class="promo-card">
                <div class="big-card">
                    <div class="big-card-title">Nádherná.</div>
                    <h2>Zo všetkých uhlov pohľadu.</h2>
                    <img
                        src="assets/mmd_miku.png"
                        alt="MMD Miku"
                        class="big-card-img"
                    />
                </div>
                <div class="card-grid">
                    <div class="sub-card">
                        <h1 class="big-text">16</h1>
                        <div class="sub-card-text">Rokov</div>
                    </div>
                    <div class="sub-card">
                        <h1 class="big-text">∞</h1>
                        <div class="sub-card-text">Obsahu</div>
                    </div>
                    <div class="sub-card">
                        <img
                            src="assets/cpu.png"
                            alt="CPU"
                            class="sub-card-img"
                        />
                        <div class="sub-card-text">Poháňaná x86</div>
                    </div>
                    <div class="sub-card">
                        <img
                            src="assets/leek.png"
                            alt="Pór"
                            class="sub-card-img"
                        />
                        <div class="sub-card-text">100% Pórovosť</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
